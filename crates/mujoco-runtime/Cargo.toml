[package]
name = "mujoco-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
robotics-core.workspace = true
rusty_mujoco.workspace = true
tempfile = "3"
roxmltree = "0.21"

[target.'cfg(not(target_os = "macos"))'.dependencies]
glfw = { version = "0.60", default-features = false, features = ["raw-window-handle-v0-6"], optional = true }

[features]
render = ["dep:glfw"]

[build-dependencies]
cc = "1"

[[example]]
name = "so101_reach"
path = "../../examples/rust/so101_reach.rs"

[[example]]
name = "panda_reach"
path = "../../examples/rust/panda_reach.rs"

[[example]]
name = "ur5e_reach"
path = "../../examples/rust/ur5e_reach.rs"

[[example]]
name = "contact_probe"
path = "../../examples/rust/contact_probe.rs"

[[example]]
name = "shape_probe"
path = "../../examples/rust/shape_probe.rs"

[[example]]
name = "pick_place_probe"
path = "../../examples/rust/pick_place_probe.rs"

[[example]]
name = "so101_pick_place"
path = "../../examples/rust/so101_pick_place.rs"

[[example]]
name = "contact_audit"
path = "../../examples/rust/contact_audit.rs"

[[example]]
name = "grip_sensitivity"
path = "../../examples/rust/grip_sensitivity.rs"

[[example]]
name = "penetration_probe"
path = "../../examples/rust/penetration_probe.rs"

[[example]]
name = "grip_command_probe"
path = "../../examples/rust/grip_command_probe.rs"

[[example]]
name = "force_grasp_probe"
path = "../../examples/rust/force_grasp_probe.rs"
